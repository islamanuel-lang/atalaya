name: SemenCheck
options:
  bundleIdPrefix: es.semencheck
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
targets:
  SemenCheck:
    type: application
    platform: iOS
    sources:
      - path: SemenCheck
        excludes:
          - Resources/Info.plist
    info:
      path: SemenCheck/Resources/Info.plist
      properties:
        CFBundleDisplayName: SemenCheck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: SemenCheck abre tu galería para leer una foto con la frase semilla. Nada se sube hasta que compruebes.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [metamask, phantom, trust, exodus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.semencheck.app
        CODE_SIGN_ENTITLEMENTS: SemenCheck/Resources/SemenCheck.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: SemenCheck/Resources/Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  SemenCheck:
    build:
      targets:
        SemenCheck: all
    run:
      config: Debug
