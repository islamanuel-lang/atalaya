name: deploy-free

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "content/**"
      - "worker/**"
      - "shared/**"

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: worker
      - name: Sincronizar núcleo compartido
        run: npm run sync
        working-directory: worker
      - name: Aplicar esquema D1
        run: npx wrangler d1 execute semencheck --remote --file schema.sql --yes
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Desplegar Worker
        run: npm run deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pages:
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm run pack
        working-directory: web
        env:
          API_BASE: ${{ vars.API_BASE }}
          SITE_URL: ${{ vars.SITE_URL }}
          TESTFLIGHT_URL: ${{ vars.TESTFLIGHT_URL }}
          APK_URL: ${{ vars.APK_URL }}
          TELEGRAM_URL: ${{ vars.TELEGRAM_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.PAGES_PROJECT || 'semencheck' }}
          workingDirectory: web
