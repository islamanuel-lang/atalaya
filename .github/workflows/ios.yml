name: ios

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Subir a TestFlight (necesita secretos de firma)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Compilar (sin firma)
        run: |
          xcodebuild \
            -project Atalaya.xcodeproj \
            -scheme Atalaya \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ios
      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Atalaya.app Payload/
          zip -qry Atalaya-unsigned.ipa Payload
        working-directory: ios
      - uses: actions/upload-artifact@v4
        with:
          name: Atalaya-unsigned
          path: ios/Atalaya-unsigned.ipa
          if-no-files-found: error

  testflight:
    if: ${{ inputs.testflight }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios

      - name: Importar certificado y perfil
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.P12_PASSWORD }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT" | base64 -d > cert.p12
          echo "$PROFILE" | base64 -d > profile.mobileprovision
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archivar
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          xcodebuild \
            -project Atalaya.xcodeproj \
            -scheme Atalaya \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Atalaya.xcarchive \
            -derivedDataPath build \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
        working-directory: ios

      - name: Exportar IPA
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROFILE_NAME }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>es.atalaya.app</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Atalaya.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa
        working-directory: ios

      - name: Subir a TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY: ${{ secrets.APPSTORE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY" > ~/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app \
            -f build/ipa/Atalaya.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER"
        working-directory: ios
