name: verify

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run sync
        working-directory: worker
      - run: node --check src/index.js
        working-directory: worker

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          API_BASE: https://api.semencheck.es
          SITE_URL: https://semencheck.es
          TESTFLIGHT_URL: https://testflight.apple.com/join/REEMPLAZA
          APK_URL: https://semencheck.es/semencheck.apk
      - run: node --check app.js
        working-directory: web
